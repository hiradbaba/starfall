<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04050c" />
    <meta
      name="description"
      content="STARFALL — a neo-retro terminal space shooter, rebuilt in 2026 from a 2019 C++ console game."
    />
    <title>STARFALL</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2304050c'/%3E%3Cpath d='M8 2l2 6H6z' fill='%235ef6ff'/%3E%3Crect x='3' y='9' width='10' height='3' fill='%235ef6ff'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <main id="stage">
      <canvas id="game" role="img" aria-label="STARFALL game screen"></canvas>
      <form id="name-form" hidden autocomplete="off">
        <label for="pilot">Pilot name</label>
        <input
          id="pilot"
          name="pilot"
          required
          spellcheck="false"
          autocapitalize="words"
          enterkeyhint="go"
        />
        <button type="submit">LAUNCH</button>
      </form>
    </main>
    <p id="hud" class="sr-only"></p>
    <p id="live" class="sr-only" aria-live="polite"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
